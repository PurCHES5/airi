name: Release Tamagotchi Godot

permissions:
  contents: write
  actions: read

env:
  PRODUCT_NAME: 'AIRI'
  PROJECT_PATH: 'engines/stage-tamagotchi-godot'

on:
  release:
    types:
      - prereleased
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific tag/version (e.g. 0.10.2). Leave empty for package.json version'
        required: false
        type: string
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            export_preset: "Windows Desktop"
            output_path: "build/win/godot-stage.exe"
            extension: "exe"
          - os: ubuntu-latest
            platform: linux
            export_preset: "Linux"
            output_path: "build/linux/godot-stage"
            extension: "zip"
          - os: ubuntu-24.04-arm
            platform: linux
            export_preset: "Linux"
            output_path: "build/linux/godot-stage"
            extension: "zip"
          - os: macos-latest
            platform: macos
            export_preset: "macOS"
            output_path: "build/mac/godot-stage.app"
            extension: "dmg"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: true

      - name: Build Godot Project
        shell: bash
        run: |
          cd ${{ env.PROJECT_PATH }}
          mkdir -p build/win build/linux build/mac
          godot --headless --export-release "${{ matrix.export_preset }}" ${{ matrix.output_path }}

      - name: Resolve Metadata and Bundle
        shell: bash
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION=$(jq -r '.version' package.json)
          fi
          VERSION=${VERSION#v} # Strip 'v' prefix if present
          
          ARCH="x64"
          if [[ "${{ matrix.os }}" == *"arm"* ]] || [[ "${{ runner.arch }}" == "ARM64" ]]; then
            ARCH="arm64"
          fi

          # Pattern: PRODUCT-VERSION-PLATFORM-ARCH.EXT
          BUNDLE_NAME="${{ env.PRODUCT_NAME }}-${VERSION}-${{ matrix.platform }}-${ARCH}.${{ matrix.extension }}"
          
          echo "Final Bundle Name: $BUNDLE_NAME"
          mkdir -p bundle

          if [ "${{ matrix.platform }}" == "linux" ]; then
            # Linux needs zipping because Godot exports a binary + .pck (if not embedded)
            zip -rj "bundle/$BUNDLE_NAME" build/linux/
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            # Simple DMG creation for macOS
            hdiutil create -volname "${{ env.PRODUCT_NAME }}" -srcfolder "${{ matrix.output_path }}" -ov -format UDZO "bundle/$BUNDLE_NAME"
          else
            # Windows
            cp "${{ matrix.output_path }}" "bundle/$BUNDLE_NAME"
          fi

          # Export for subsequent steps
          echo "BUNDLE_NAME=$BUNDLE_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.platform }}-${{ strategy.job-index }}
          path: ${{ env.PROJECT_PATH }}/bundle/${{ env.BUNDLE_NAME }}

      - name: Upload To GitHub Releases
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_PATH }}/bundle/${{ env.BUNDLE_NAME }}
          tag_name: v${{ env.VERSION }}

  publish-butler:
    name: Publish to itch.io
    needs: build
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup butler
        uses: remarkablegames/setup-butler@v2

      - name: Push to Itch
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Example for Windows:
          FILE=$(find artifacts -name "*.exe")
          butler push "$FILE" user/project:windows-alpha