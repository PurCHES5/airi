name: Release Tamagotchi Godot

permissions:
  contents: write
  actions: read

env:
  PRODUCT_NAME: 'AIRI'
  PROJECT_PATH: 'engines/stage-tamagotchi-godot'
  GODOT_VERSION: 4.6.2

on:
  release:
    types:
      - prereleased
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build only (skip release upload)'
        required: false
        default: false
        type: boolean
      tag:
        description: 'Specific tag (e.g. 0.10.2)'
        required: false
        type: string
      platform:
        description: 'Target Platform'
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
          - linux
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_key: windows
            platform_label: win
            export_preset: "Windows Desktop"
            output_path: "build/win/godot-stage.exe"
            extension: "exe"
          - os: ubuntu-latest
            platform_key: linux
            platform_label: linux
            export_preset: "Linux"
            output_path: "build/linux/godot-stage"
            extension: "zip"
          - os: ubuntu-24.04-arm
            platform_key: linux
            platform_label: linux
            export_preset: "Linux"
            output_path: "build/linux/godot-stage"
            extension: "zip"
          - os: macos-latest
            platform_key: macos
            platform_label: macos
            export_preset: "macOS"
            output_path: "build/mac/godot-stage.app"
            extension: "dmg"

    steps:
      - name: Check Platform Filter
        id: filter
        shell: bash
        run: |
          SELECTED="${{ github.event.inputs.platform }}"
          CURRENT="${{ matrix.platform_key }}"
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] || [[ "$SELECTED" == "all" ]] || [[ "$SELECTED" == "$CURRENT" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Godot
        if: steps.filter.outputs.should_run == 'true'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2 
          use-dotnet: true

      - name: Install Godot Export Templates
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: |
          GODOT_VERSION="${{ env.GODOT_VERSION }}.stable.mono"
          
          # Determine target directory based on OS
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            TARGET_DIR="$APPDATA/Godot/export_templates/$GODOT_VERSION"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            TARGET_DIR="$HOME/Library/Application Support/Godot/export_templates/$GODOT_VERSION"
          else
            TARGET_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          fi

          mkdir -p "$TARGET_DIR"
          
          URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_export_templates.tpz"
          
          TEMP_FILE="templates.tpz"
          
          curl -L --retry 5 --retry-delay 5 --connect-timeout 30 "$URL" -o "$TEMP_FILE"
          
          if [ -f "$TEMP_FILE" ] && [ -s "$TEMP_FILE" ]; then
            unzip -q "$TEMP_FILE" -d temp_templates
            mv temp_templates/templates/* "$TARGET_DIR/"
            rm -rf "$TEMP_FILE" temp_templates
            echo "Templates installed to $TARGET_DIR"
          else
            echo "Failed to download or install Godot Export Templates"
          fi

      - name: Build Godot Project
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: |
          cd ${{ env.PROJECT_PATH }}
          mkdir -p build/win build/linux build/mac
          godot --headless --export-release "${{ matrix.export_preset }}" ${{ matrix.output_path }}

      - name: Resolve Metadata and Bundle
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION=$(jq -r '.version' package.json)
          fi
          VERSION=${VERSION#v}
          
          ARCH="x64"
          if [[ "${{ matrix.os }}" == *"arm"* ]] || [[ "${{ runner.arch }}" == "ARM64" ]]; then
            ARCH="arm64"
          fi

          BUNDLE_NAME="${{ env.PRODUCT_NAME }}-${VERSION}-${{ matrix.platform_label }}-${ARCH}.${{ matrix.extension }}"
          echo "BUNDLE_NAME=$BUNDLE_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          mkdir -p bundle

          if [ "${{ matrix.platform_label }}" == "linux" ]; then
            zip -rj "bundle/$BUNDLE_NAME" build/linux/
          elif [ "${{ matrix.platform_label }}" == "macos" ]; then
            hdiutil create -volname "${{ env.PRODUCT_NAME }}" -srcfolder "${{ matrix.output_path }}" -ov -format UDZO "bundle/$BUNDLE_NAME"
          else
            cp "${{ matrix.output_path }}" "bundle/$BUNDLE_NAME"
          fi

      - name: Upload Artifact
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.platform_label }}-${{ strategy.job-index }}
          path: ${{ env.PROJECT_PATH }}/bundle/${{ env.BUNDLE_NAME }}

      - name: Release to GitHub
        if: steps.filter.outputs.should_run == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'false'))
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_PATH }}/bundle/${{ env.BUNDLE_NAME }}
          tag_name: v${{ env.VERSION }}
